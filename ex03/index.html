
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Colors & Opacity</h1>

    <h2>Color Palette</h2>

    <div class="color-palette">
        <div class="swatch named-color">
            <p>Named Color</p>
            <p>tomato</p>
        </div>

        <div class="swatch hex-color">
            <p>HEX Color</p>
            <p>#3498DB</p>
        </div>

        <div class="swatch rgb-color">
            <p>RGB Color</p>
            <p>rgb(46, 204, 113)</p>
        </div>

        <div class="swatch rgba-color">
            <p>RGBA Color</p>
            <p>rgba(155, 89, 182, 0.5)</p>
        </div>
    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">
        <div class="example opacity-example">
            <h3>Using opacity: 0.5</h3>
            <div class="box opacity-box">
                <p>This text also becomes transparent.</p>
            </div>
        </div>

        <div class="example rgba-example">
            <h3>Using RGBA</h3>
            <div class="box rgba-box">
                <p>This text stays fully opaque.</p>
            </div>
        </div>
    </div>

</body>
</html>
