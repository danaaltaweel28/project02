
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>The CSS Box Model</h1>

    <p>Compare content-box and border-box.</p>

    <section class="comparison">
        <div class="example">
            <h2>content-box</h2>
            <div class="box content-box">
                Content Box
            </div>
            <p>Width: 200px</p>
            <p>Total width: 250px</p>
        </div>

        <div class="example">
            <h2>border-box</h2>
            <div class="box border-box">
                Border Box
            </div>
            <p>Width: 200px</p>
            <p>Total width: 200px</p>
        </div>
    </section>

</body>
</html>
